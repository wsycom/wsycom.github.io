// ============================================================
// 1. 背景星空闪烁 + 流星动画
// ============================================================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let stars = [];
let shootingStars = [];
let animId;

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Star {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2.8 + 0.5;
    this.baseOpacity = Math.random() * 0.5 + 0.5;
    this.opacity = this.baseOpacity;
    this.twinkleSpeed = Math.random() * 0.1 + 0.03;
    this.phase = Math.random() * Math.PI * 2;
    this.hue = Math.random() > 0.6 ? (Math.random() * 60 + 190) : 0;
    this.saturation = this.hue ? 40 : 0;
    this.hasSpike = this.size > 1.8;
    this.spikeLen = this.size * 4;
  }
  update(time) {
    const wave = Math.sin(time * this.twinkleSpeed + this.phase);
    this.opacity = this.baseOpacity + wave * 0.45;
    this.opacity = Math.max(0.08, Math.min(1, this.opacity));
    this.currentSize = this.size + wave * 0.4;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(0.3, this.currentSize), 0, Math.PI * 2);
    if (this.hue) {
      ctx.fillStyle = `hsla(${this.hue}, ${this.saturation}%, 88%, ${this.opacity})`;
    } else {
      ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
    }
    ctx.fill();
    if (this.size > 0.8) {
      const glow = this.size * 5;
      const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glow);
      gradient.addColorStop(0, `rgba(255,255,255,${this.opacity * 0.25})`);
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.beginPath();
      ctx.arc(this.x, this.y, glow, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }
    if (this.hasSpike && this.opacity > 0.4) {
      const spikeAlpha = (this.opacity - 0.4) * 0.6;
      ctx.strokeStyle = `rgba(255,255,255,${spikeAlpha})`;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(this.x - this.spikeLen, this.y);
      ctx.lineTo(this.x + this.spikeLen, this.y);
      ctx.moveTo(this.x, this.y - this.spikeLen);
      ctx.lineTo(this.x, this.y + this.spikeLen);
      ctx.stroke();
    }
  }
}

class ShootingStar {
  constructor() { this.active = false; this.opacity = 0; }
  launch() {
    this.x = Math.random() * canvas.width * 0.7;
    this.y = Math.random() * canvas.height * 0.35;
    this.len = Math.random() * 120 + 60;
    this.speed = Math.random() * 8 + 6;
    this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
    this.life = 1;
    this.decay = Math.random() * 0.008 + 0.005;
    this.active = true;
    this.opacity = 1;
    this.trailWidth = Math.random() * 1.5 + 1;
  }
  update() {
    if (!this.active) return;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
    this.opacity = Math.max(0, this.life);
    if (this.life <= 0 || this.x > canvas.width + 50 || this.y > canvas.height + 50) {
      this.active = false;
    }
  }
  draw() {
    if (!this.active || this.opacity < 0.01) return;
    const tailX = this.x - Math.cos(this.angle) * this.len;
    const tailY = this.y - Math.sin(this.angle) * this.len;
    const grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
    grad.addColorStop(0, `rgba(255,255,255,0)`);
    grad.addColorStop(0.6, `rgba(200,220,255,${this.opacity * 0.4})`);
    grad.addColorStop(1, `rgba(255,255,255,${this.opacity})`);
    ctx.beginPath();
    ctx.moveTo(tailX, tailY);
    ctx.lineTo(this.x, this.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.trailWidth;
    ctx.stroke();
    const headGlow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, 6);
    headGlow.addColorStop(0, `rgba(255,255,255,${this.opacity})`);
    headGlow.addColorStop(1, `rgba(200,220,255,0)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = headGlow;
    ctx.fill();
  }
}

for (let i = 0; i < 350; i++) stars.push(new Star());
for (let i = 0; i < 5; i++) shootingStars.push(new ShootingStar());

let frame = 0;
function drawBackground() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  frame++;
  stars.forEach(s => { s.update(frame); s.draw(); });
  shootingStars.forEach(s => { s.update(); s.draw(); });
  if (Math.random() < 0.02) {
    const inactive = shootingStars.find(s => !s.active);
    if (inactive) inactive.launch();
  }
  animId = requestAnimationFrame(drawBackground);
}
drawBackground();

const gradeList = ['四年级','五年级','六年级'];
const subjectList = ['语文','数学','英语','科学','总分'];

// ============================================================
// 3. 颜色分组方案
// ============================================================
const groupPalettes = {
  low:   { light: '#fde8e8', mid: '#e74c3c', dark: '#922b21' },
  mid:   { light: '#d6eaf8', mid: '#3498db', dark: '#1a5276' },
  high:  { light: '#d5f5e3', mid: '#2ecc71', dark: '#1a7a42' }
};

function assignGroupColors(items) {
  if (items.length === 0) return [];
  const sorted = [...items].sort((a, b) => a.avg - b.avg);
  const n = sorted.length;
  const lowCount = Math.max(2, Math.round(n * 0.22));
  const highCount = Math.max(2, Math.round(n * 0.33));
  const midCount = n - lowCount - highCount;
  sorted.forEach((item, idx) => {
    if (idx < lowCount) item._group = 'low';
    else if (idx < lowCount + midCount) item._group = 'mid';
    else item._group = 'high';
  });
  const result = [];
  ['low', 'mid', 'high'].forEach(group => {
    const groupItems = sorted.filter(d => d._group === group).sort((a, b) => a.avg - b.avg);
    groupItems.forEach((item, idx) => {
      const palette = groupPalettes[group];
      const ratio = groupItems.length > 1 ? idx / (groupItems.length - 1) : 0.5;
      const alpha = 0.40 + 0.60 * ratio;
      const r = parseInt(palette.dark.slice(1,3), 16);
      const g = parseInt(palette.dark.slice(3,5), 16);
      const b = parseInt(palette.dark.slice(5,7), 16);
      item._color = `rgba(${r},${g},${b},${alpha})`;
      result.push(item);
    });
  });
  return result.sort((a, b) => b.avg - a.avg);
}

// ============================================================
// 4. ECharts 图表
// ============================================================
const chartDom = document.getElementById('chart');
const myChart = echarts.init(chartDom, 'dark', { renderer: 'canvas' });

let currentGrade = '四年级';
let currentSubject = '语文';
let isPlaying = true;
let playTimer = null;
let selectedSchool = null; // 单击校名锁定高亮

// 计算名次分：各科各年级排名，第一名 n 分，第二名 n-1 分...
function computeRankScores() {
  const scores = {};
  gradeList.forEach(grade => {
    subjectList.forEach(subject => {
      const items = allData[grade][subject];
      if (!items || items.length === 0) return;
      const sorted = [...items].sort((a, b) => b.avg - a.avg);
      sorted.forEach((item, idx) => {
        const pts = sorted.length - idx; // 第1名得18分，第2名17分...
        if (!scores[item.school]) scores[item.school] = 0;
        scores[item.school] += pts;
      });
    });
  });
  return scores;
}
const rankScores = computeRankScores();

function buildOption(grade, subject) {
  const rawItems = (allData[grade] && allData[grade][subject]) ? allData[grade][subject].map(d => ({...d})) : [];
  let isEmpty = rawItems.length === 0;
  
  if (isEmpty) {
    return {
      backgroundColor: 'transparent',
      title: {
        text: '⏳ 该年级数据待补充',
        textStyle: { color: 'rgba(255,255,255,0.3)', fontSize: 22, fontWeight: 400 },
        left: 'center',
        top: 'center'
      },
      xAxis: { show: false },
      yAxis: { show: false },
      series: []
    };
  }
  
  const coloredItems = assignGroupColors(rawItems);
  const schools = coloredItems.map(d => d.school);
  const scores = coloredItems.map(d => d.avg);
  const minScore = Math.min(...scores);
  const maxScore = Math.max(...scores);
  const scoreRange = maxScore - minScore;
  const axisMin = subject === '总分'
    ? Math.floor((minScore - scoreRange * 0.15) / 10) * 10
    : Math.floor((minScore - scoreRange * 0.20) / 5) * 5;
  const axisMax = Math.ceil((maxScore + scoreRange * 0.05) / 5) * 5;

  return {
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'shadow' },
      formatter: function(params) {
        const p = params[0];
        const idx = coloredItems.findIndex(d => d.school === p.name);
        const item = coloredItems[idx];
        const groupLabel = item._group === 'low' ? '⚠ 偏低' : item._group === 'mid' ? '● 中等' : '★ 优秀';
        return `<strong>${p.name}</strong><br/>
                ${grade} · ${subject}平均分：<strong style="color:#ffd700;font-size:16px">${p.value}</strong><br/>
                <span style="color:rgba(255,255,255,0.5)">${groupLabel}</span>`;
      },
      backgroundColor: 'rgba(11,14,26,0.9)',
      borderColor: '#ffd700',
      borderWidth: 2,
      textStyle: { color: '#fff', fontSize: 13 },
      extraCssText: 'box-shadow: 0 0 20px rgba(255,215,0,0.25); border-radius: 8px;'
    },
    grid: { top: 20, bottom: 20, left: 20, right: 210 },
    xAxis: {
      type: 'value',
      min: axisMin,
      max: axisMax,
      splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)', type: 'dashed' } },
      axisLabel: {
        color: 'rgba(255,255,255,0.4)',
        fontSize: 11,
        formatter: v => subject === '总分' ? v : v + ''
      },
      axisLine: { show: false },
      axisTick: { show: false }
    },
    yAxis: {
      type: 'category',
      data: schools,
      position: 'right',
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: {
        color: 'rgba(255,255,255,0.5)',
        fontSize: 13,
        fontWeight: 600,
        formatter: function(value) {
          const score = rankScores[value];
          if (selectedSchool) {
            // 锁定模式：所有学校显示名次分，选中学校高亮
            if (value === selectedSchool) {
              return '{selected|🏆' + score + '  ' + value + '}';
            } else {
              return score + '  ' + value;
            }
          }
          // 未锁定：只显示校名
          return value;
        },
        // 富文本样式，让选中学校变金色高亮
        rich: {
          selected: {
            color: '#ffd700',
            fontSize: 14,
            fontWeight: 700,
            textShadowColor: 'rgba(255,215,0,0.5)',
            textShadowBlur: 6
          }
        }
      },
      animationDuration: 300,
      animationDurationUpdate: 300
    },
    series: [{
      type: 'bar',
      data: coloredItems.map((item, i) => {
        const isSelected = selectedSchool && item.school === selectedSchool;
        // 普通颜色
        let barColor = new echarts.graphic.LinearGradient(0, 0, 1, 0, [
          { offset: 0, color: 'rgba(255,255,255,0.20)' },
          { offset: 1, color: item._color }
        ]);
        let barBorder = null;
        let barShadow = item._color.replace(/[\d.]+\)$/, '0.35)');
        let barShadowBlur = 10;
        // 选中学校：亮黄色高亮（其他学校颜色不变）
        if (selectedSchool && isSelected) {
          barColor = new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: 'rgba(255,215,0,0.15)' },
            { offset: 1, color: 'rgba(255,215,0,0.95)' }
          ]);
          barBorder = { color: '#ffd700', width: 3 };
          barShadow = 'rgba(255,215,0,0.5)';
          barShadowBlur = 18;
        }
        return {
          value: item.avg,
          itemStyle: {
            color: barColor,
            borderRadius: [0, 4, 4, 0],
            shadowColor: barShadow,
            shadowBlur: barShadowBlur,
            shadowOffsetX: 2,
            borderColor: barBorder ? barBorder.color : 'transparent',
            borderWidth: barBorder ? barBorder.width : 0
          },
          emphasis: {
            itemStyle: {
              color: barColor,
              borderColor: 'transparent',
              borderWidth: 0
            }
          }
        };
      }),
      barWidth: '50%',
      label: {
        show: true,
        position: 'right',
        color: '#fff',
        fontSize: 13,
        fontWeight: 600,
        textShadowColor: 'rgba(0,0,0,0.5)',
        textShadowBlur: 4,
        formatter: function(p) {
          return subject === '总分' ? p.value.toFixed(0) : p.value.toFixed(1);
        }
      },
      animationDuration: 800,
      animationDurationUpdate: 800,
      animationEasing: 'elasticOut',
      animationEasingUpdate: 'cubicOut'
    }]
  };
}

function render(grade, subject) {
  currentGrade = grade;
  currentSubject = subject;
  myChart.setOption(buildOption(grade, subject), true);
  document.querySelectorAll('.grade-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.grade === grade);
  });
  document.querySelectorAll('.subject-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.subject === subject);
  });
  // 更新锁定提示
  const focusLabel = document.getElementById('focusLabel');
  const exitBtn = document.getElementById('exitFocusBtn');
  if (selectedSchool) {
    focusLabel.textContent = `📍 锁定：${selectedSchool}`;
    focusLabel.style.display = 'inline';
    exitBtn.style.display = 'inline-flex';
  } else {
    focusLabel.style.display = 'none';
    exitBtn.style.display = 'none';
  }
}

// ============================================================
// 5. 轮播控制：按 年级→学科 顺序循环
// ============================================================
function getNextView() {
  if (selectedSchool) {
    // 锁定模式：四→五→六年级，各科依次轮播
    const si = subjectList.indexOf(currentSubject);
    if (si < subjectList.length - 1) {
      return { grade: currentGrade, subject: subjectList[si + 1] };
    } else {
      const gi = gradeList.indexOf(currentGrade);
      const nextGi = (gi + 1) % gradeList.length;
      return { grade: gradeList[nextGi], subject: subjectList[0] };
    }
  }
  const gi = gradeList.indexOf(currentGrade);
  const si = subjectList.indexOf(currentSubject);
  if (si < subjectList.length - 1) {
    return { grade: currentGrade, subject: subjectList[si + 1] };
  } else {
    const nextGi = (gi + 1) % gradeList.length;
    return { grade: gradeList[nextGi], subject: subjectList[0] };
  }
}

function startPlay() {
  isPlaying = true;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('playBtn').classList.add('active-btn');
  document.getElementById('timerLabel').textContent = '自动轮播中';
  clearInterval(playTimer);
  playTimer = setInterval(() => {
    const next = getNextView();
    render(next.grade, next.subject);
  }, 3500);
}

function stopPlay() {
  isPlaying = false;
  document.getElementById('playBtn').textContent = '⏯';
  document.getElementById('playBtn').classList.remove('active-btn');
  document.getElementById('timerLabel').textContent = '已暂停';
  clearInterval(playTimer);
}

function togglePlay() {
  if (isPlaying) stopPlay();
  else startPlay();
}

function prevView() {
  const gi = gradeList.indexOf(currentGrade);
  const si = subjectList.indexOf(currentSubject);
  if (si > 0) {
    render(currentGrade, subjectList[si - 1]);
  } else {
    const prevGi = (gi - 1 + gradeList.length) % gradeList.length;
    render(gradeList[prevGi], subjectList[subjectList.length - 1]);
  }
}

function nextView() {
  const next = getNextView();
  render(next.grade, next.subject);
}

// ============================================================
// 6. 事件绑定
// ============================================================
document.querySelectorAll('.grade-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const g = this.dataset.grade;
    if (isPlaying) stopPlay();
    render(g, currentSubject);
  });
});
document.querySelectorAll('.subject-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    const s = this.dataset.subject;
    if (isPlaying) stopPlay();
    render(currentGrade, s);
  });
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (isPlaying) stopPlay();
  prevView();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (isPlaying) stopPlay();
  nextView();
});
document.getElementById('playBtn').addEventListener('click', togglePlay);

// 点击校名锁定高亮
myChart.on('click', function(params) {
  if (params.componentType === 'yAxis' || (params.componentType === 'series' && params.name)) {
    const schoolName = params.name;
    if (selectedSchool === schoolName) {
      // 点击同一学校：退出锁定
      selectedSchool = null;
      if (isPlaying) stopPlay();
      render(currentGrade, currentSubject);
    } else {
// 点击不同学校：锁定该校，停止轮播保持锁定
      selectedSchool = schoolName;
          if (isPlaying) stopPlay();
          render(currentGrade, currentSubject);
    }
  }
});
// 点击空白区域退出锁定
myChart.on('click', function(params) {
  if (params.componentType === 'title' || (!params.componentType && !params.name)) {
    if (selectedSchool) {
      selectedSchool = null;
      if (isPlaying) stopPlay();
      render(currentGrade, currentSubject);
    }
  }
});

// 退出锁定按钮
document.getElementById('exitFocusBtn').addEventListener('click', function() {
  selectedSchool = null;
  if (isPlaying) stopPlay();
  render(currentGrade, currentSubject);
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') { if (isPlaying) stopPlay(); prevView(); }
  if (e.key === 'ArrowRight') { if (isPlaying) stopPlay(); nextView(); }
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});
window.addEventListener('resize', () => { myChart.resize(); });

// ============================================================
// 7. 初始化
// ============================================================
render('四年级', '语文');
startPlay();
</script>
