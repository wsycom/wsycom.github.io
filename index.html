            /* 极淡的绿色背景 (降低50%浓度) */
            background-color: #f4fbf4; 
            margin: 0;
            padding: 40px 20px;
            color: #333333;
        }

        /* 内容容器 */
        .container {
            max-width: 700px;
            margin: 0 auto; /* 容器居中，但内部文字左对齐 */
        }

        /* 标题样式 */
        h1 {
            /* 橙黄色字体 */

            margin-bottom: 30px;
        }

        /* 链接列表样式 */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 15px;
            /* 列表项背景：极淡的绿色，呼应大背景 */
            background-color: #f0f8f0; 
            border-radius: 8px;
            /* 左侧橙色装饰条 */
            border-left: 5px solid #ff9800; 
            transition: all 0.2s ease;
        }

        /* 鼠标悬停效果 */
        li:hover {
            background-color: #e8f5e9; /* 悬停时稍微深一点点 */
            transform: translateX(5px); /* 微微向右移动 */
        }

        /* 链接文字样式 */
        a {
            display: block;
            text-decoration: none;
            color: #333333; /* 深灰色字体 */
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 500;
        }
        
        /* 链接内的图标微调 */
        .icon {
            margin-right: 8px;
        }
    </style>
</head>
