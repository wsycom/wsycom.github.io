<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的教学课件库</title>
    <style>
        /* 页面整体设置 */
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #e8f5e9; /* 淡淡的绿色背景 */
            margin: 0;
            padding: 40px 20px;
            color: #333333; /* 统一的深灰色字体 */
            display: flex;
            justify-content: center;
        }

        /* 内容容器 */
        .container {
            max-width: 700px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.6); /* 半透明白色底板，让文字更清晰 */
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* 橙黄色大标题 */
        h1 {
            color: #ff9800; /* 橙黄色 */
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1); /* 加一点阴影增加立体感 */
        }

        /* 提示语样式 */
        p.subtitle {
            text-align: center;
            font-size: 1.1em;
            margin-bottom: 30px;
            color: #333333;
        }

        /* 列表样式 */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background-color: #ffffff;
            margin-bottom: 15px;
            border-radius: 8px;
            transition: transform 0.2s;
            border-left: 5px solid #ff9800; /* 左侧橙色装饰条 */
        }

        li:hover {
            transform: translateX(5px); /* 鼠标悬停时轻微移动 */
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 链接样式 */
        a {
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: #333333; /* 保持和提示语一样的颜色 */
            font-weight: 500;
            font-size: 1.1em;
        }

        a:hover {
            color: #ff9800; /* 鼠标放上去变橙色 */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 橙黄色标题 -->

    </div>

</body>
